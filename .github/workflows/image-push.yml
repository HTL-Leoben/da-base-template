# Author: Marko Schrempf
name: Push Docker Image

on:
  workflow_run:
    workflows: ["Build Docker Image"] 
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  push:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: actions-ecosystem/action-get-latest-tag@v1
        id: latest-tag

      - name: Extract Docker Metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
            ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKERHUB_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.latest-tag.outputs.tag }}
            type=sha
          labels: |
            org.opencontainers.image.vendor=HTL Leoben
            org.opencontainers.image.title=htlle-da-builder
            org.opencontainers.image.description=Environment for building the diploma thesis of the HTL Leoben
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=LicenseRef-HTL-Leoben-Educational-1.0
            org.opencontainers.image.base.name=docker.io/library/debian:trixie-slim
            org.opencontainers.image.authors=Marko Schrempf, Günther Hutter
          annotations: |
            org.opencontainers.image.vendor=HTL Leoben
            org.opencontainers.image.title=htlle-da-builder
            org.opencontainers.image.description=Environment for building the diploma thesis of the HTL Leoben
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=LicenseRef-HTL-Leoben-Educational-1.0
            org.opencontainers.image.base.name=docker.io/library/debian:trixie-slim
            org.opencontainers.image.authors=Marko Schrempf, Günther Hutter

      - name: Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GitHub Container Registry Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: tools/docker
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
